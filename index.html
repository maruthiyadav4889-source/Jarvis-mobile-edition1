<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S</title>
    <!-- Basic styling to make it look like a terminal interface -->
    <style>
        body {
            background-color: #0c1c2b; /* Dark background */
            color: #00d9ff; /* Cyan text */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { margin-bottom: 5px; }
        .sub { font-size: 0.9em; opacity: 0.8; margin-top: 0; }
        .active { color: #00ff00; font-weight: bold; margin-bottom: 30px; }
        ul { list-style: none; padding: 0; }
        li { margin: 10px 0; }
        .status-on { color: #00ff00; }
        .status-locked { color: #ff9900; }
    </style>
</head>
<body>
    <div>
        <h1>J.A.R.V.I.S</h1>
        <p class="sub">MOBILE EDITION</p>
        <p class="active">CORE ACTIVE</p>

        <h3>SYSTEM STATUS</h3>
        <ul>
            <li>AI CORE: <span class="status-on">ONLINE</span></li>
            <li>NETWORK: <span class="status-on">ONLINE</span></li>
            <li>VOICE: <span class="status-locked">LOCKED</span></li>
            <li>MEMORY: <span class="status-locked">LOCKED</span></li>
            <li>[SEND]</li>
        </ul>
    </div>

    <!-- Ensure script.js exists in the same folder -->
    <script src="script.js"></script>
</body>
</html>
